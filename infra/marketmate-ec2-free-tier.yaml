AWSTemplateFormatVersion: "2010-09-09"
Description: >
  MarketMate Python demo on a single free-tier-eligible EC2 instance.
  Uses Amazon Linux 2023, a small gp3 root volume, no Elastic IP, and opens only
  the app port by default. Free-tier eligibility depends on your AWS account,
  region, existing usage, and current AWS terms.

Parameters:
  ProjectName:
    Type: String
    Default: marketmate
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]{1,31}$"

  GitRepoUrl:
    Type: String
    Description: HTTPS Git URL containing the python-marketmate folder.

  GitBranch:
    Type: String
    Default: main

  AppSubdirectory:
    Type: String
    Default: python-marketmate

  AppPort:
    Type: Number
    Default: 5273
    MinValue: 1024
    MaxValue: 65535

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
    Description: t2.micro/t3.micro are commonly Free Tier eligible for older accounts; verify eligibility in your region/account.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair name for SSH access.

  SshIngressCidr:
    Type: String
    AllowedPattern: "^(([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2})$"
    Description: CIDR allowed to SSH into the instance. Use your-ip/32.

  RootVolumeSizeGb:
    Type: Number
    Default: 8
    MinValue: 8
    MaxValue: 30
    Description: Keep at 8 GB for the smallest practical demo volume.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-minimal-kernel-default-x86_64

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch into. Choose your default VPC for the simplest free-tier demo.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with internet access and auto-assign public IPv4 support.

  AppIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^(([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2})$"
    Description: CIDR allowed to reach the app port. Use your-ip/32 for a tighter demo.

  SplunkAccessTokenParameterName:
    Type: String
    Default: /marketmate/splunk/access-token
    Description: Name of the encrypted SSM SecureString parameter containing the Splunk Observability access token.

  OpenAIApiKeyParameterName:
    Type: String
    Default: /marketmate/openai/api-key
    Description: Name of the encrypted SSM SecureString parameter containing the OpenAI API key.

  SplunkHecTokenParameterName:
    Type: String
    Default: /marketmate/splunk/hec-token
    Description: Name of the encrypted SSM SecureString parameter containing the Splunk Cloud Platform HEC token for GenAI evaluation events.

  SplunkHecEndpoint:
    Type: String
    Default: https://http-inputs-shw-playground.splunkcloud.com/services/collector
    Description: Splunk Cloud Platform HEC endpoint used for GenAI evaluation logs/events.

  SplunkRealm:
    Type: String
    Default: us1
    Description: Splunk Observability Cloud realm.

  EnvironmentName:
    Type: String
    Default: marketmate
    Description: Value for the OpenTelemetry deployment.environment resource attribute.

  SplunkOtelMemoryMiB:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 768
    Description: Memory limit passed to the Splunk OTel Collector installer.

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ec2-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: !Sub "${ProjectName}-read-demo-secrets"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SplunkAccessTokenParameterName}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenAIApiKeyParameterName}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SplunkHecTokenParameterName}"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Allow inbound MarketMate app traffic on ${AppPort}"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshIngressCidr
          Description: SSH access
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          CidrIp: !Ref AppIngressCidr
          Description: MarketMate Python app
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound internet for package install and OpenAI API
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sg"
        - Key: Project
          Value: !Ref ProjectName

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      CreditSpecification:
        CPUCredits: standard
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGb
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-python-demo"
        - Key: Project
          Value: !Ref ProjectName
        - Key: CostControl
          Value: free-tier-eligible-demo
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          APP_USER=marketmate
          APP_HOME=/opt/marketmate
          REPO_DIR=$APP_HOME/repo
          APP_DIR=$REPO_DIR/${AppSubdirectory}

          dnf update -y
          dnf install -y --allowerasing awscli git python3.11 python3.11-pip sudo

          SPLUNK_ACCESS_TOKEN=$(aws ssm get-parameter --name "${SplunkAccessTokenParameterName}" --with-decryption --query Parameter.Value --output text --region ${AWS::Region})
          OPENAI_API_KEY=$(aws ssm get-parameter --name "${OpenAIApiKeyParameterName}" --with-decryption --query Parameter.Value --output text --region ${AWS::Region})
          SPLUNK_HEC_TOKEN=$(aws ssm get-parameter --name "${SplunkHecTokenParameterName}" --with-decryption --query Parameter.Value --output text --region ${AWS::Region})

          curl -sSL https://dl.observability.splunkcloud.com/splunk-otel-collector.sh > /tmp/splunk-otel-collector.sh
          sh /tmp/splunk-otel-collector.sh \
            --realm ${SplunkRealm} \
            --hec-token "$SPLUNK_HEC_TOKEN" \
            --hec-url "${SplunkHecEndpoint}" \
            --memory ${SplunkOtelMemoryMiB} \
            --deployment-environment ${EnvironmentName} \
            -- "$SPLUNK_ACCESS_TOKEN"

          cat >>/etc/otel/collector/splunk-otel-collector.conf <<COLLECTORENV
          SPLUNK_HEC_TOKEN=$SPLUNK_HEC_TOKEN
          SPLUNK_HEC_URL=${SplunkHecEndpoint}
          COLLECTORENV

          grep -q "splunk_hec:" /etc/otel/collector/agent_config.yaml
          grep -q "pipelines:" /etc/otel/collector/agent_config.yaml
          systemctl restart splunk-otel-collector

          id -u $APP_USER >/dev/null 2>&1 || useradd --system --home-dir $APP_HOME --shell /sbin/nologin $APP_USER
          mkdir -p $APP_HOME
          chown -R $APP_USER:$APP_USER $APP_HOME

          if [ -d "$REPO_DIR/.git" ]; then
            sudo -u $APP_USER git -C "$REPO_DIR" fetch origin ${GitBranch}
            sudo -u $APP_USER git -C "$REPO_DIR" checkout ${GitBranch}
            sudo -u $APP_USER git -C "$REPO_DIR" pull --ff-only origin ${GitBranch}
          else
            sudo -u $APP_USER git clone --branch ${GitBranch} --depth 1 ${GitRepoUrl} "$REPO_DIR"
          fi

          cd "$APP_DIR"
          sudo -u $APP_USER python3.11 -m venv .venv
          sudo -u $APP_USER .venv/bin/python -m pip install --upgrade pip
          sudo -u $APP_USER .venv/bin/pip install -r requirements.txt

          cat >/etc/systemd/system/marketmate.service <<'SERVICE'
          [Unit]
          Description=MarketMate Python app
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=marketmate
          WorkingDirectory=/opt/marketmate/repo/${AppSubdirectory}
          Environment=PORT=${AppPort}
          Environment=OTEL_SERVICE_NAME=marketmate-ec2
          Environment=OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
          Environment=OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
          Environment=OTEL_RESOURCE_ATTRIBUTES=deployment.environment=${EnvironmentName}
          Environment=OTEL_INSTRUMENTATION_GENAI_EMITTERS=span_metric_event,splunk
          Environment=OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true
          Environment=OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT_MODE=SPAN_AND_EVENT
          Environment=OTEL_INSTRUMENTATION_GENAI_EVALS_RESULTS_AGGREGATION=true
          Environment=OTEL_INSTRUMENTATION_GENAI_EMITTERS_EVALUATION=replace-category:SplunkEvaluationResults
          Environment=OTEL_INSTRUMENTATION_GENAI_EVALS_SEPARATE_PROCESS=false
          Environment=OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
          Environment=OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=delta
          Environment=DEEPEVAL_FILE_SYSTEM=READ_ONLY
          Environment=DEEPEVAL_TELEMETRY_OPT_OUT=YES
          EnvironmentFile=-/etc/marketmate/marketmate.env
          ExecStart=/opt/marketmate/repo/${AppSubdirectory}/.venv/bin/opentelemetry-instrument /opt/marketmate/repo/${AppSubdirectory}/.venv/bin/python app.py
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          mkdir -p /etc/marketmate
          cat >/etc/marketmate/marketmate.env <<ENVFILE
          OPENAI_API_KEY=$OPENAI_API_KEY
          ENVFILE
          chmod 600 /etc/marketmate/marketmate.env

          systemctl daemon-reload
          systemctl enable marketmate
          systemctl restart marketmate

Outputs:
  InstanceId:
    Description: EC2 instance ID.
    Value: !Ref AppInstance

  PublicIp:
    Description: Public IPv4 address. This may change when the instance stops/starts because no Elastic IP is used.
    Value: !GetAtt AppInstance.PublicIp

  PublicDnsName:
    Description: Public DNS name.
    Value: !GetAtt AppInstance.PublicDnsName

  AppUrl:
    Description: MarketMate app URL.
    Value: !Sub "http://${AppInstance.PublicDnsName}:${AppPort}"
